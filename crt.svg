<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d170d"/>
      <stop offset="100%" stop-color="#070d07"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <clipPath id="screen"><rect x="30" y="30" width="840" height="360" rx="26"/></clipPath>
  </defs>

  <rect width="900" height="420" rx="34" fill="#1b1d1b"/>
  <rect x="14" y="14" width="872" height="392" rx="30" fill="#101210" stroke="#2b2f2b" stroke-width="2"/>
  <rect x="30" y="30" width="840" height="360" rx="26" fill="url(#tube)"/>

  <g clip-path="url(#screen)">
    <g filter="url(#glow)" font-family="VT323, Terminus, 'Courier New', monospace" font-size="26" fill="#39ff6a" xml:space="preserve">
      <text x="64" y="86">lispovckiy@debian:~$ whoami</text>
      <text x="64" y="120" fill="#a8ffbf">lispovckiy</text>

      <text x="64" y="172">lispovckiy@debian:~$ cat languages</text>
      <text x="64" y="206" fill="#a8ffbf">C  C++  x86-64 asm</text>

      <text x="64" y="258">lispovckiy@debian:~$ ls projects/</text>
      <text x="64" y="292" fill="#a8ffbf">rawm/</text>

      <text x="64" y="344">lispovckiy@debian:~$</text>
      <rect x="342" y="324" width="14" height="26" fill="#39ff6a">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="30" y="30" width="840" height="360" fill="url(#scan)"/>
    <rect x="30" y="-60" width="840" height="60" fill="#39ff6a" opacity="0.05">
      <animate attributeName="y" from="-60" to="420" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="30" width="840" height="360" fill="url(#vig)"/>
  </g>

  <rect x="30" y="30" width="840" height="360" rx="26" fill="none" stroke="#050805" stroke-width="3"/>
  <circle cx="850" cy="404" r="3.5" fill="#39ff6a" opacity="0.8"/>
</svg>
